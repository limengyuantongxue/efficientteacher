# EfficientTeacher by Alibaba Cloud 

# Parameters
project: '/runs_yolov5'
adam: False
epochs: 200

weights: ""
prune_finetune: False
linear_lr: True
hyp:
  lr0: 0.01
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  lrf: 0.1
  scale: 0.9
  no_aug_epochs: 0
  mixup: 0.1
  warmup_epochs: 3

Model:
  depth_multiple: 0.67  # model depth multiple
  width_multiple: 0.75  # layer channel multiple
  Backbone: 
    name: 'SmallDefect'
    activation: 'SiLU'
    widths: [64, 128, 256, 512]
    boundary_ratio: 0.001          # b1 小/中 边界(面积占比)
    boundary_ratio_large: 0.002    # b2 中/大 边界
    small_channels: 192            # 三路输出通道(与 neck 的 in_channels x width_multiple 一致)
    medium_channels: 384
    large_channels: 768
    ha_temperature: 1.0            # 软标签 sigmoid 温度(像素)
  Neck: 
    name: 'YoloV5' 
    in_channels: [256, 512, 1024]
    out_channels: [256, 512, 1024]
    activation: 'SiLU'
  Head: 
    name: 'YoloV5'
    activation: 'SiLU'
  anchors: [[10,13, 16,30, 33,23],[30,61, 62,45, 59,119],[116,90, 156,198, 373,326]]  # P5/32]
Loss:
  type: 'ComputeLoss'
  cls: 0.3
  obj: 0.7
  anchor_t: 4.0
  ha_loss_weight: 0.1
  
  top_k: 13

Dataset:
  data_name: 'coco'
  train: D:/dataset/broken_pencil_cocotoyolo/images/train_origin.txt  # 118287 images
  val: D:/dataset/broken_pencil_cocotoyolo/images/val_origin.txt # 5000 images
  test: D:/dataset/broken_pencil_cocotoyolo/images/val_origin.txt # 20288 of 40670 images, submit to https://competitions.codalab.org/competitions/20794^
  nc: 3  # number of classes
  np: 0 #number of keypoints
  names: [ 'body_broken', 'eraser_broken', 'NG' ]
  img_size: 640
  batch_size: 12