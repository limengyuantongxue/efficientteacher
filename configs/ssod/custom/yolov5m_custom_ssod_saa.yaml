# EfficientTeacher by Alibaba Cloud 

# Parameters
project: 'exp_ssod/'
adam: False
epochs: 200
# resume: True
# weights: "D:/个人文件/文献/毕业论文参考/code/efficientteacher/exp_ssod/exp14/weights/last.pt"
prune_finetune: False
linear_lr: True
hyp:
  lr0: 0.01
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  lrf: 0.1
  scale: 0.9
  no_aug_epochs: 0
  mixup: 0.1
  mosaic: 1.0
  warmup_epochs: 0
  burn_epochs: 40

Model:
  depth_multiple: 0.67  # model depth multiple
  width_multiple: 0.75  # layer channel multiple
  Backbone: 
    name: 'YoloV5'
    activation: 'SiLU'
  Neck: 
    name: 'YoloV5' 
    in_channels: [256, 512, 1024]
    out_channels: [256, 512, 1024]
    activation: 'SiLU'
  Head: 
    name: 'YoloV5'
    activation: 'SiLU'
  anchors: [[10,13, 16,30, 33,23],[30,61, 62,45, 59,119],[116,90, 156,198, 373,326]]  # P5/32]
Loss:
  type: 'ComputeLoss'
  cls: 0.3
  obj: 0.7
  anchor_t: 4.0
  # --- SaA: dual-scale aware label assignment ---
  #assigner_type: 'SaA'
  # scale_threshold: 约 0.001*img_size^2 (像素面积)。对 1280 图约 1638.4；640 图为 409.6
  scale_threshold: 409.0
  scale_temperature: 1.0

Dataset:
  data_name: 'coco'
  train: D:/dataset/broken_pencil_cocotoyolo/images/train_origin.txt  # 4911 images
  val: D:/dataset/broken_pencil_cocotoyolo/images/val_origin.txt  # 1230 images
  test: D:/dataset/broken_pencil_cocotoyolo/images/val_origin.txt # 8607 images
  target: D:/dataset/broken_pencil_cocotoyolo/images/unlabel_image.txt
  nc: 3  # number of classes
  np: 0 #number of keypoints
  names: [ 'body_broken', 'eraser_broken', 'NG']
  img_size: 640
  batch_size: 24

SSOD:
  train_domain: True
  nms_conf_thres: 0.1
  nms_iou_thres: 0.4
  teacher_loss_weight: 1.0
  cls_loss_weight: 0.3
  box_loss_weight: 0.05
  obj_loss_weight: 0.7
  loss_type: 'ComputeStudentMatchLoss'
  ignore_thres_low: 0.05
  ignore_thres_high: 0.3
  uncertain_aug: True
  use_ota: False
  multi_label: False
  ignore_obj: False
  pseudo_label_with_obj: True
  pseudo_label_with_bbox: True
  pseudo_label_with_cls: False
  with_da_loss: False
  da_loss_weights: 0.01
  epoch_adaptor: True
  resample_high_percent: 0.25
  resample_low_percent: 0.99
  ema_rate: 0.996
  cosine_ema: True
  imitate_teacher: False
  ssod_hyp:
    with_gt: False
    mosaic: 1.0
    cutout: 0.5
    autoaugment: 0.5
    scale: 0.8
    degrees: 0.0
    shear: 0.0
